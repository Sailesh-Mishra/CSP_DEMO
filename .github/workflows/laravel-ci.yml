
name: Laravel CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  laravel-build:
    runs-on: ubuntu-latest

    steps:
      - name: Get Latest Code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, xml, curl, zip, bcmath
          coverage: none

      - name: Install Composer Dependencies
        working-directory: csp-demo
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Laravel Tests
        working-directory: csp-demo
        env:
          APP_ENV: testing
          APP_KEY: ${{ secrets.LARAVEL_APP_KEY }}
        run: php artisan test

  deploy:
    runs-on: ubuntu-latest
    needs: laravel-build

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ALWAYSDATA_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ALWAYSDATA_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/alwaysdata_deploy
          chmod 600 ~/.ssh/alwaysdata_deploy

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy Laravel to Alwaysdata
        run: |
          ssh -i ~/.ssh/alwaysdata_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            sailesh-mishra@ssh-sailesh-mishra.alwaysdata.net \
            'cd ~/CSP_DEMO &&
             git pull --ff-only origin main &&
             cd csp-demo &&
             composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader &&
             php artisan migrate --force &&
             php artisan optimize:clear &&
             php artisan config:cache'
